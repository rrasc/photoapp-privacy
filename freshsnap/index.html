<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshSnap — AI Food Expiry Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #060e20; color: #dee5ff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { text-align: center; padding: 40px 20px; max-width: 600px; }
        .icon { width: 120px; height: 120px; border-radius: 28px; margin: 0 auto 32px; }
        h1 { font-size: 48px; font-weight: 800; color: #a3a6ff; margin-bottom: 8px; letter-spacing: -1px; }
        .tagline { font-size: 20px; color: #a3aac4; margin-bottom: 40px; }
        .features { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; margin-bottom: 48px; }
        .feat { background: #091328; padding: 20px; border-radius: 16px; width: 160px; text-align: center; }
        .feat-icon { font-size: 32px; margin-bottom: 8px; }
        .feat-text { font-size: 14px; color: #a3aac4; }
        .badge { display: inline-block; background: linear-gradient(135deg, #a3a6ff, #6063ee); color: #000; padding: 14px 32px; border-radius: 12px; font-weight: 700; font-size: 16px; text-decoration: none; margin-bottom: 32px; }
        .links { display: flex; gap: 24px; justify-content: center; margin-top: 32px; }
        .links a { color: #6d758c; font-size: 14px; text-decoration: none; }
        .links a:hover { color: #a3a6ff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>FreshSnap</h1>
        <p class="tagline">Scan. Track. Waste Less.</p>

        <div class="features">
            <div class="feat">
                <div class="feat-icon">📷</div>
                <div class="feat-text">AI Food Scanner</div>
            </div>
            <div class="feat">
                <div class="feat-icon">⏱️</div>
                <div class="feat-text">Expiry Alerts</div>
            </div>
            <div class="feat">
                <div class="feat-icon">🍽️</div>
                <div class="feat-text">Recipe Ideas</div>
            </div>
        </div>

        <a href="https://play.google.com/store/apps/details?id=com.freshsnap.app" class="badge">
            Get it on Google Play
        </a>

        <div class="links">
            <a href="privacy-policy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Service</a>
        </div>
    </div>
</body>
</html>
